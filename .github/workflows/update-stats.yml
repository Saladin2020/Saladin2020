name: Update stats cards

# Regenerates the SVG cards embedded in the profile README.
# Commits use the built-in GITHUB_TOKEN only (contents: write). Public data
# only — private counts are not requested.
#
# The push trigger is limited to this workflow and the generator, and the bot
# commit message includes [skip ci], so committing the SVGs does not retrigger
# the workflow.

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/update-stats.yml
      - scripts/generate_stats.py

permissions:
  contents: write

concurrency:
  group: update-stats-cards
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Generate SVG cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATS_LOGIN: ${{ github.repository_owner }}
        run: python3 scripts/generate_stats.py

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/github-stats.svg assets/github-stats-dark.svg assets/top-langs.svg assets/top-langs-dark.svg
          if git diff --staged --quiet; then
            echo "Stats cards are already up to date."
            exit 0
          fi
          git commit -m "Update GitHub stats cards [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
